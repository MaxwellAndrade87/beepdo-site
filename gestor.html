<style>
:root{--bg:#F6F6F9;--sf:#FFFFFF;--bd:#E6E6EE;--bd2:#D9D9E3;--tx:#1B1B23;--mu:#5E5E6E;--ac:#5B3FB0;--acs:#EFEAFB;--ok:#1E6B3A;--oks:#E3F4E8;--er:#B3261E;--ers:#FDECEA;--wa:#7A5000;--was:#FFF4D6;--in:#0D5788;--ins:#D6ECFB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
.app{display:flex;min-height:100vh}
.side{width:236px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px;margin:-6px 0;border-radius:10px;color:inherit;text-decoration:none}
a.brand:hover{background:#F4F4F8}
.brand b{font-size:16px;display:block}.brand small{color:var(--mu);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:500;color:#3A3A48}
.nav button:hover{background:#F4F4F8}
.nav button.on{background:var(--acs);color:var(--ac);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--ers);color:var(--er);border-radius:999px;padding:2px 7px}
.side .rodape{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 8px;font-size:12px;color:var(--mu)}
.side .quem{display:flex;align-items:center;gap:10px;padding-bottom:4px}
.side .quem b{font-size:14px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .quem small{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .ava{width:34px;height:34px;border-radius:50%;background:var(--acs);color:var(--ac);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.main{flex:1;min-width:0;padding:28px 34px 60px;display:flex;flex-direction:column;gap:18px}
.topo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
h1{margin:0;font-size:24px;font-weight:700}
h2{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--mu);font-size:13px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px}
.card.flush{padding:0;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi span{font-size:12px;color:var(--mu)}.kpi b{font-size:26px}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--bd2);background:var(--sf);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:#BDBDCB}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.pri:hover{background:#4C33A0}
.btn.sm{min-height:32px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ac)}
.btn.danger{color:var(--er)}
.seg{display:inline-flex;gap:4px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:4px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;min-height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;color:#3A3A48;display:inline-flex;align-items:center}
.seg button.on{background:var(--ac);color:#fff}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{min-height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--bd2);background:var(--sf);font-size:13px;font-weight:600;cursor:pointer}
.chipsel button.on{border-color:var(--ac);background:var(--acs);color:var(--ac)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:#3A3A48}
input.i,select.i,textarea.i{min-height:40px;padding:8px 10px;border:1px solid var(--bd2);border-radius:10px;background:var(--sf);font-size:14px;font-weight:400;width:100%}
textarea.i{min-height:80px;resize:vertical}
input[type=color].i{padding:3px;width:44px;min-height:36px}
.tag{display:inline-flex;align-items:center;justify-content:center;height:24px;min-width:40px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.p-ok{background:var(--oks);color:var(--ok)}.p-er{background:var(--ers);color:var(--er)}.p-wa{background:var(--was);color:var(--wa)}.p-in{background:var(--ins);color:var(--in)}.p-mu{background:#EEEEF3;color:#3A3A48}

table.t th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:12px 14px;border-bottom:1px solid #EEEEF3;white-space:nowrap}
table.t td{padding:10px 14px;border-bottom:1px solid #F3F3F7;vertical-align:middle}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:#FAFAFC}
.alerta{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px}
.alerta i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.a-er{background:var(--ers)}.a-er i{background:var(--er)}
.a-wa{background:var(--was)}.a-wa i{background:#C98A00}
.a-in{background:#E4F1FB}.a-in i{background:var(--in)}
.vazio{color:var(--mu);font-size:13px;padding:8px 0}

.esc{border-collapse:separate;border-spacing:2px;font-size:11px}
.esc th{font-weight:600;color:var(--mu);padding:3px 0;min-width:44px;text-align:center}

.esc td.c{height:30px;border-radius:6px;text-align:center;font-weight:700;cursor:pointer;padding:0 2px}
.esc td.c.ov{box-shadow:inset 0 0 0 1.5px var(--ac)}
.esc td.c.sel{outline:2px solid var(--ac);outline-offset:1px}
.esc td.tot{text-align:center;font-size:12px;color:var(--mu);min-width:44px}
.esc tr.tit td{padding:14px 10px 4px;font-size:13px;font-weight:700;background:var(--sf);position:sticky;left:0}
.esc td.cob{text-align:center;font-size:12px;font-weight:700;height:22px;border-radius:6px}
.legenda{display:flex;flex-wrap:wrap;gap:6px}

.pop .chips{display:flex;flex-wrap:wrap;gap:6px}
.pop .chips button{border:none;border-radius:8px;min-height:32px;min-width:48px;padding:0 8px;font-size:12px;font-weight:700;cursor:pointer}

.bhg td.c{min-width:64px;height:44px;border-radius:8px;text-align:center;cursor:pointer;line-height:1.15}
.bhg td.c b{display:block;font-size:13px}.bhg td.c small{font-size:10px;font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border:1px solid var(--bd2);border-radius:8px;background:var(--sf);cursor:pointer;font-size:16px}
.stepper span{min-width:58px;text-align:center;font-weight:700}
.regra{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F3F3F7}
.regra:last-child{border-bottom:none}
.regra .l{display:flex;flex-direction:column;gap:2px}.regra .l small{color:var(--mu);font-size:12px}
.modal-fundo{position:fixed;inset:0;background:rgba(20,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal{background:var(--sf);border-radius:16px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1B1B23;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal:has(.largo){max-width:940px}
.fa-topo{display:flex;flex-direction:column;gap:14px}
.esticavel{overflow:auto;resize:vertical;min-height:200px;max-height:none;flex:none}
.esticavel::-webkit-resizer{background:linear-gradient(135deg,transparent 50%,var(--mu) 50%,var(--mu) 60%,transparent 60%,transparent 72%,var(--mu) 72%,var(--mu) 82%,transparent 82%)}
.esticavel .t tr.tit td{position:sticky;top:0;z-index:1;background:var(--sf)}
details.avisos{border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
details.avisos summary{cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
details.avisos summary::-webkit-details-marker{display:none}
.modal:has(.fa-rodape) .fa-rodape{position:sticky;bottom:-22px;background:var(--sf);padding:12px 0 2px;margin-bottom:-2px;border-top:1px solid var(--bd)}
@media print{
  @page{size:A4 landscape;margin:8mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .side,.btn,.seg,.pop,.toast,.modal-fundo,.legenda,.card:not([data-scroll]){display:none!important}
  .app{display:block}.main{padding:0!important;max-width:none}
  .topo .sub{display:none}
  [data-scroll]{overflow:visible!important;border:none!important;box-shadow:none!important;padding:0!important}
  .esc{font-size:7.5px;border-spacing:1px;width:100%}
  .esc th{min-width:0;padding:1px 0}.esc th .d{font-size:8px}
  .esc th.nm,.esc td.nm{position:static;min-width:0;font-size:9px;padding:0 4px;white-space:nowrap}
  .esc td.c{height:17px;border-radius:2px}.esc td.c.ov{box-shadow:none}
  .esc td.tot{min-width:0;font-size:8px}.esc tr.tit td{position:static;padding:6px 4px 2px;font-size:9px}
  .esc td.cob{height:12px;font-size:8px}
}
.salvo{font-size:12px;color:var(--mu)}
.login{max-width:380px;margin:12vh auto;padding:28px}
.menu-mob{display:none}
@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:static;padding:12px 14px;gap:10px;border-right:none;border-bottom:1px solid var(--bd)}
  .side .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .side .nav button{white-space:nowrap;min-height:38px}
  .side .rodape{display:none}
  .main{padding:18px 14px 50px}
  h1{font-size:20px}
}
</style>
</head>

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = (n) => (n < 10 ? '0' : '') + n;
function ymd(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function dt(s) { const [a, m, d] = s.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d)); }
function addD(s, n) { const d = dt(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); }
function diffD(a, b) { return Math.round((dt(b) - dt(a)) / 864e5); }

function dow(s) { return dt(s).getUTCDay(); }
function diasNoMes(a, m) { return new Date(Date.UTC(a, m, 0)).getUTCDate(); }
const SEM = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const SEMC = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function br(s) { const [a, m, d] = s.split('-'); return d + '/' + m; }
function brA(s) { const [a, m, d] = s.split('-'); return d + '/' + m + '/' + a; }
function h(v) { const a = Math.abs(v); const t = (Math.round(a * 10) / 10).toString().replace('.', ',') + 'h'; return (v < 0 ? '-' : '') + t; }

function hm2min(s) { const [a, b] = (s || '0:0').split(':').map(Number); return a * 60 + (b || 0); }
function corTexto(hex) { const c = hex.replace('#', ''); const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16); return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? '#1B1B23' : '#FFFFFF'; }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2200); }

/* ============ feriados ============ */
function pascoa(a) { const f = Math.floor, G = a % 19, C = f(a / 100), H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30, I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)), J = (a + f(a / 4) + I + 2 - C + f(C / 4)) % 7, L = I - J, m = 3 + f((L + 40) / 44), d = L + 28 - 31 * f(m / 4); return a + '-' + pad(m) + '-' + pad(d); }
const _ferCache = {};
function feriadosDoAno(a) {

  [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência'], ['10-12', 'N. Sra. Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Consciência Negra'], ['12-25', 'Natal']].forEach(([md, n]) => { r[a + '-' + md] = n; });

const CICLOS_PRONTOS = { '6x2': [[6, 2]], '6x1 / 5x2': [[6, 1], [5, 2]], '5x2': [[5, 2]], '12x36': [[1, 1]], '6x1': [[6, 1]] };

function mesAtual() { if (!S.ui.mes) S.ui.mes = hojeStr().slice(0, 7); return S.ui.mes.split('-').map(Number); }

function casaRegra(r, s) {

  if (r.freq === 'semanal') return (r.dias || []).includes(dow(s)) && Math.floor(diffD(segundaDe(r.inicio), segundaDe(s)) / 7) % n === 0;

/* ============ FOLGAS DE FIM DE ANO ============ */
// Distribui folgas (BH) em volta do Natal e do Ano Novo: metade da equipe folga
// num, metade no outro. Só vira folga o dia em que a pessoa trabalharia.
const FA_NOME = { N: 'Natal', A: 'Ano Novo' };
function faJanelas(mm) {
  const fazer = (dia) => { const r = []; for (let i = -mm.antes; i < mm.n - mm.antes; i++) r.push(addD(dia, i)); return r; };
  return { N: fazer(mm.ano + '-12-25'), A: fazer((mm.ano + 1) + '-01-01') };
}
function faTag(mm) { return 'Fim de ano ' + mm.ano; }
/** A escala sem as folgas de fim de ano já lançadas (pra simular em cima do que seria o normal). */
function faSemLancadas(mm, fn) {
  const guardadas = S.ausencias;
  S.ausencias = guardadas.filter((x) => x.obs !== faTag(mm));
  _escCache = {};
  try { return fn(); } finally { S.ausencias = guardadas; _escCache = {}; }
}
function faNoPosto(pid, s) { return !!diaEscala(s).posto[pid]; }
function faCobertura(mm, tid, s, jan) {
  const d = diaEscala(s);
  return Object.keys(d.posto).filter((pid) => d.turno[pid] === tid && d.posto[pid] && !(mm.grupos[pid] && jan[mm.grupos[pid]].includes(s))).length;
}
function faDividir(mm) {
  const jan = faJanelas(mm);
  mm.grupos = {};
  faSemLancadas(mm, () => {
    S.cfg.turnos.forEach((t) => {
      const gente = S.equipe.filter((p) => p.ativo !== false && turnoEm(p, jan.N[0]) === t.id).sort((a, b) => a.nome.localeCompare(b.nome));
      const qtd = { N: 0, A: 0 };
      gente.forEach((p) => {
        const dias = { N: jan.N.filter((s) => faNoPosto(p.id, s)).length, A: jan.A.filter((s) => faNoPosto(p.id, s)).length };
        if (!dias.N && !dias.A) return; // férias, afastado: não entra na divisão
        const pior = (g) => { mm.grupos[p.id] = g; const v = Math.min.apply(null, jan[g].map((s) => faCobertura(mm, t.id, s, jan))); delete mm.grupos[p.id]; return v; };
        const cN = pior('N'), cA = pior('A');
        let g = cN !== cA ? (cN > cA ? 'N' : 'A') : qtd.N !== qtd.A ? (qtd.N < qtd.A ? 'N' : 'A') : 'N';
        // equilíbrio: um grupo nunca fica com 2 a mais que o outro no mesmo turno
        if (qtd[g] - qtd[g === 'N' ? 'A' : 'N'] >= 1) g = g === 'N' ? 'A' : 'N';
        mm.grupos[p.id] = g; qtd[g]++;
      });
    });
  });
}
A.fimAno = () => {
  if (!S.equipe.length) { toast('Cadastre a equipe primeiro'); return; }
  const hj = hojeStr(), ano = hj.slice(5) > '01-05' ? +hj.slice(0, 4) : +hj.slice(0, 4) - 1;
  const bh = S.cfg.siglas.find((x) => x.descontaBH) || S.cfg.siglas.find((x) => x.tipo === 'ausencia');
  S.ui.modal = { t: 'fimAno', ano, n: 3, antes: 1, sigla: bh ? bh.sigla : 'BH', grupos: {} };
  faDividir(S.ui.modal); render();
};

A.faN = (el) => { const mm = S.ui.modal; mm.n = Math.max(1, Math.min(7, mm.n + +el.dataset.d)); mm.antes = Math.min(mm.antes, mm.n - 1); faDividir(mm); render(); };
A.faAntes = (el) => { const mm = S.ui.modal; mm.antes = Math.max(0, Math.min(mm.n - 1, mm.antes + +el.dataset.d)); faDividir(mm); render(); };
A.faGrupo = (el) => { const mm = S.ui.modal; if (el.dataset.g) mm.grupos[el.dataset.p] = el.dataset.g; else delete mm.grupos[el.dataset.p]; render(); };

function faPlano(mm) {
  const jan = faJanelas(mm);
  return faSemLancadas(mm, () => {
    const fim = jan.A[jan.A.length - 1];
    const turnos = S.cfg.turnos.map((t) => {
      const gente = S.equipe.filter((p) => p.ativo !== false && turnoEm(p, jan.N[0]) === t.id).sort((a, b) => a.nome.localeCompare(b.nome)).map((p) => {
        const g = mm.grupos[p.id] || '';
        return { p, g, dias: g ? jan[g].filter((s) => faNoPosto(p.id, s)) : [], antes: saldoBH(p.id, fim) };
      });
      const cob = jan.N.concat(jan.A).map((s) => ({ s, n: faCobertura(mm, t.id, s, jan) }));
      return { t, gente, cob, precisa: princ(setorDoTurno(t.id)).length };
    });
    // saldo de verdade: simula com as folgas lançadas (folgar no feriado também perde o bônus do feriado)
    turnos.forEach(({ gente }) => gente.forEach(({ p, dias }) => dias.forEach((s) => S.ausencias.push({ id: 'fa', pessoaId: p.id, sigla: mm.sigla, de: s, ate: s }))));
    _escCache = {};
    turnos.forEach(({ gente }) => gente.forEach((x) => { x.saldo = saldoBH(x.p.id, fim); x.horas = Math.round((x.antes - x.saldo) * 10) / 10; }));
    return { jan, turnos };
  });
}

    });
  });
  cv.toBlob((b) => { const u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = 'Escala_' + MESES[m - 1] + '_' + a + '.png'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('Imagem gerada'); }, 'image/png');
};

/* ============ eventos ============ */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el) { if (S.ui.pop && !ev.target.closest('.pop')) { S.ui.pop = null; S.ui.manterScroll = true; render(); } return; }
  if (el.dataset.a === 'fecharModal' && el.classList.contains('modal-fundo') && ev.target.closest('[data-stop]')) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { /* deixa o checkbox marcar e reage */ }
  const fn = A[el.dataset.a]; if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', (ev) => { const el = ev.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el, ev); });
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-f]'); if (!f) return; ev.preventDefault();
  ({ login: onLogin, pessoa: onPessoa, importar: onImportar, ausencia: onAusencia, tarefa: onTarefa, reuniao: onReuniao, feriado: onFeriado })[f.dataset.f](f);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && (S.ui.modal || S.ui.pop)) { if (S.ui.modal && S.ui.modal.t === 'conferido') { A.cfDescartar(); return; } S.ui.modal = null; S.ui.pop = null; render(); } });

/* ============ início ============ */
function telaPremium() {
  return '<div class="login card col" style="gap:12px;max-width:460px">' +
    '<h2>Área do Gestor é Premium</h2>' +
    '<span class="sub">Escala da equipe, banco de horas, ausências e reuniões ficam liberados para quem assina o BeepDo Premium.</span>' +
    '<span class="sub">Assine no app BeepDo (Perfil &gt; Premium) usando esta mesma conta: <b>' + esc(S.user.email || '') + '</b>. Depois é só voltar aqui.</span>' +
    '<div class="row" style="gap:8px;justify-content:flex-end"><a href="#" class="btn" data-a="sair">' + (NO_APP ? 'Fechar' : 'Sair') + '</a><button class="btn pri" onclick="location.reload()">Já assinei, verificar</button></div></div>';
}
/** Nome da pessoa: o do perfil do BeepDo; sem ele, o do cadastro; por último, o começo do e-mail. */
function nomeUsuario() {
  const u = S.user || {}, m = u.user_metadata || {};
  const n = (S.nome || m.username || m.full_name || m.name || '').trim();
  if (n) return n;
  const e = (u.email || '').split('@')[0].replace(/[._\-]+/g, ' ').replace(/\d+/g, '').trim();
  return e ? e.charAt(0).toUpperCase() + e.slice(1) : 'Gestor';
}
async function entrar(user) {
  if (S.user && S.user.id === user.id) return;
  S.user = user;
  $('#raiz').innerHTML = '<div class="login card"><span class="sub">Carregando sua equipe…</span></div>';
  try {
    const { data: liberado, error: erroAcesso } = await sb.rpc('gestor_tem_acesso');
    if (erroAcesso) throw erroAcesso;
    if (!liberado) { $('#raiz').innerHTML = telaPremium(); return; }
    await carregar();
    try { const { data: pf } = await sb.from('user_profiles').select('username').eq('id', user.id).maybeSingle(); if (pf && pf.username) S.nome = pf.username; } catch (e) {}
  } catch (e) { $('#raiz').innerHTML = '<div class="login card col"><h2>Não consegui carregar</h2><span class="sub">' + esc(e.message || e) + '</span><button class="btn" onclick="location.reload()">Tentar de novo</button></div>'; return; }
  _escCache = {};
  render();
}
sb.auth.onAuthStateChange((evt, sess) => { if (sess && sess.user) entrar(sess.user); else if (evt === 'SIGNED_OUT') { S.user = null; render(); } });
if (NO_APP) {
  // O app manda um token novo quando pedimos (a cada 40 min), sem gastar o refresh token dele.
  window.__beepdoSessao = (s) => sb.auth.setSession(s).catch(() => {});
  setInterval(() => avisarApp({ tipo: 'token' }), 40 * 60 * 1000);
  sb.auth.setSession(window.__BEEPDO_APP.sessao).then(({ data }) => {
    if (data && data.session) entrar(data.session.user);
    else $('#raiz').innerHTML = '<div class="login card col"><h2>Sessão expirada</h2><span class="sub">Feche e abra a Área do Gestor de novo pelo app.</span><a href="#" class="btn" data-a="sair">Fechar</a></div>';
  });
} else sb.auth.getSession().then(({ data }) => { if (data.session) entrar(data.session.user); else render(); });
</script>
