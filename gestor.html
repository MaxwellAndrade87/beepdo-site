</style>

<script>
'use strict';
/* ============ conexão ============ */
const SB_URL = 'https://kbbclredwktimecdqtwq.supabase.co';
const SB_KEY = 'sb_publishable_vuSQaDWky4xRYPwCPvbr8g_5AUFizC5';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'beepdo-gestor', detectSessionInUrl: true, flowType: 'pkce' } });

/* ============ utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = (n) => (n < 10 ? '0' : '') + n;
function ymd(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function dt(s) { const [a, m, d] = s.split('-').map(Number); return new Date(Date.UTC(a, m - 1, d)); }
function addD(s, n) { const d = dt(s); d.setUTCDate(d.getUTCDate() + n); return ymd(d); }
function diffD(a, b) { return Math.round((dt(b) - dt(a)) / 864e5); }
function hojeStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

function brA(s) { const [a, m, d] = s.split('-'); return d + '/' + m + '/' + a; }
function h(v) { const a = Math.abs(v); const t = (Math.round(a * 10) / 10).toString().replace('.', ',') + 'h'; return (v < 0 ? '-' : '') + t; }

function hm2min(s) { const [a, b] = (s || '0:0').split(':').map(Number); return a * 60 + (b || 0); }

/* ============ feriados ============ */
function pascoa(a) { const f = Math.floor, G = a % 19, C = f(a / 100), H = (C - f(C / 4) - f((8 * C + 13) / 25) + 19 * G + 15) % 30, I = H - f(H / 28) * (1 - f(29 / (H + 1)) * f((21 - G) / 11)), J = (a + f(a / 4) + I + 2 - C + f(C / 4)) % 7, L = I - J, m = 3 + f((L + 40) / 44), d = L + 28 - 31 * f(m / 4); return a + '-' + pad(m) + '-' + pad(d); }
const _ferCache = {};
function feriadosDoAno(a) {
  if (_ferCache[a]) return _ferCache[a];
  const p = pascoa(a), r = {};
  [['01-01', 'Confraternização Universal'], ['04-21', 'Tiradentes'], ['05-01', 'Dia do Trabalho'], ['09-07', 'Independência'], ['10-12', 'N. Sra. Aparecida'], ['11-02', 'Finados'], ['11-15', 'Proclamação da República'], ['11-20', 'Consciência Negra'], ['12-25', 'Natal']].forEach(([md, n]) => { r[a + '-' + md] = n; });
  r[addD(p, -2)] = 'Sexta-feira Santa';
  (S.cfg.feriadosExtras || []).forEach((f) => { if (f.recorrente) r[a + f.data.slice(4)] = f.nome; else if (f.data.startsWith(a + '-')) r[f.data] = f.nome; });
  (S.cfg.feriadosIgnorados || []).forEach((d) => { delete r[d]; });
  return (_ferCache[a] = r);
}
function feriado(s) { return feriadosDoAno(+s.slice(0, 4))[s] || null; }

/* ============ padrões (tudo editável) ============ */
const CICLOS_PRONTOS = { '6x2': [[6, 2]], '6x1 / 5x2': [[6, 1], [5, 2]], '5x2': [[5, 2]], '12x36': [[1, 1]], '6x1': [[6, 1]] };

  return {
    v: 1,
    equipeNome: 'Minha equipe',
    ciclo: { nome: '6x2', blocos: [[6, 2]] },
    turnos: [

    exportar: { cores: true, bh: true, abas: false }
  };
}

/* ============ estado e gravação ============ */
const S = { user: null, cfg: cfgPadrao(), equipe: [], ausencias: [], ajustes: {}, bh: { saldoInicial: {}, lanc: {} }, tarefas: [], reunioes: [], view: 'painel', ui: {} };
const CHAVES = ['config', 'equipe', 'ausencias', 'ajustes', 'bh', 'tarefas', 'reunioes'];
const MAPA = { config: 'cfg', equipe: 'equipe', ausencias: 'ausencias', ajustes: 'ajustes', bh: 'bh', tarefas: 'tarefas', reunioes: 'reunioes' };
const _pend = {};
let _salvando = 0;
function salvar(chave) {
  _escCache = {};
  if (chave === 'config') Object.keys(_ferCache).forEach((k) => delete _ferCache[k]);
  clearTimeout(_pend[chave]);
  marcaSalvo('Salvando…');
  _pend[chave] = setTimeout(async () => {
    _salvando++;
    const { error } = await sb.from('gestor_docs').upsert({ user_id: S.user.id, chave, dados: S[MAPA[chave]] });
    _salvando--;
    if (error) { marcaSalvo('Erro ao salvar'); toast('Não consegui salvar: ' + error.message); } else if (!_salvando) marcaSalvo('Tudo salvo');
  }, 600);
}
function marcaSalvo(t) { const el = $('#salvo'); if (el) el.textContent = t; }
async function carregar() {
  const { data, error } = await sb.from('gestor_docs').select('chave,dados');
  if (error) throw error;
  (data || []).forEach((r) => { if (MAPA[r.chave]) S[MAPA[r.chave]] = r.dados; });
  const base = cfgPadrao();
  S.cfg = Object.assign(base, S.cfg || {});
  S.cfg.bh = Object.assign(cfgPadrao().bh, S.cfg.bh || {});

  if (!S.ajustes || typeof S.ajustes !== 'object') S.ajustes = {};
  return (data || []).length;
}

/* ============ siglas e cores ============ */
function princ() { return S.cfg.postos.map((p) => p.sigla); }
function ehSup(c) { return !!c && c.startsWith(S.cfg.sup.prefixo) && /\d+$/.test(c.slice(S.cfg.sup.prefixo.length)); }
function ehPosto(c) { return princ().includes(c) || ehSup(c); }
function siglaInfo(c) {
  if (!c) return null;
  const p = S.cfg.postos.find((x) => x.sigla === c); if (p) return { sigla: c, nome: p.nome, tipo: 'posto', cor: p.cor };
  if (ehSup(c)) return { sigla: c, nome: S.cfg.sup.nome + ' ' + c.slice(S.cfg.sup.prefixo.length), tipo: 'posto', cor: S.cfg.sup.cor };
  return S.cfg.siglas.find((x) => x.sigla === c) || { sigla: c, nome: c, tipo: 'ausencia', cor: '#EEEEF3' };
}
function trabalhando(c) { const i = siglaInfo(c); return !!i && (i.tipo === 'posto' || i.tipo === 'treinamento' || i.tipo === 'turno'); }
function tagStyle(c) { const i = siglaInfo(c) || { cor: '#EEEEF3' }; return 'background:' + i.cor + ';color:' + corTexto(i.cor); }

function ausenciaDe(pid, s) { let r = null; for (const a of S.ausencias) if (a.pessoaId === pid && s >= a.de && s <= a.ate) r = a; return r; }
function turnoPorId(id) { return S.cfg.turnos.find((t) => t.id === id); }

  const t = turnoPorId(id); if (!t) return [0, 0];

function descansoEntre(t1, t2) { return (1440 + janela(t2)[0] - janela(t1)[1]) / 60; }

/* ============ motor da escala ============ */
let _escCache = {};
function ancora() { const h = hojeStr(); return (+h.slice(0, 4) - 1) + '-' + h.slice(5, 7) + '-01'; }
function simular(ate) {
  const c = _escCache;
  const ini = c.ini || addD(ancora(), 0);
  if (c.ate && ate <= c.ate) return c;
  if (!c.dias) { c.ini = ini; c.dias = {}; c.ontem = {}; c.ultSup = {}; c.ate = addD(ini, -1); }
  const P = princ(), pref = S.cfg.sup.prefixo;
  const ativos = S.equipe.filter((p) => p.ativo !== false);
  for (let s = addD(c.ate, 1); s <= ate; s = addD(s, 1)) {
    const fer = feriado(s), dia = { cod: {}, posto: {}, turno: {} };
    const disp = {}, forc = {};
    S.cfg.turnos.forEach((t) => { disp[t.id] = []; forc[t.id] = []; });
    ativos.forEach((p) => {
      let cod = null, tReal = p.turno, livre = false;
      const ov = S.ajustes[p.id + '|' + s];
      const a = ausenciaDe(p.id, s);
      const ciclo = trabalhaCiclo(p, s);
      if (a) {
        const inf = siglaInfo(a.sigla);
        if (inf.tipo === 'turno') { if (ciclo) { cod = a.sigla; tReal = inf.destino; livre = true; } else cod = 'x'; }
        else if (inf.tipo === 'treinamento') cod = ciclo ? a.sigla : 'x';
        else cod = a.sigla;
      } else if (!ciclo || (fer && S.cfg.feriadoModo === 'folga')) cod = 'x';
      else livre = true;
      if (ov) {
        if (ehPosto(ov)) { dia.cod[p.id] = cod && siglaInfo(cod).tipo === 'turno' ? cod : ov; dia.posto[p.id] = ov; dia.turno[p.id] = tReal; if (disp[tReal]) forc[tReal].push(ov); return; }
        cod = ov; livre = false;
      }
      dia.turno[p.id] = tReal;
      if (livre && disp[tReal]) { disp[tReal].push(p.id); dia.cod[p.id] = cod || '?'; }
      else { dia.cod[p.id] = cod; dia.posto[p.id] = null; }
    });
    S.cfg.turnos.forEach((t) => {
      const d = disp[t.id], f = forc[t.id];
      const n = d.length + f.length;
      const need = Math.max(0, Math.min(n, P.length) - f.filter((x) => P.includes(x)).length);
      const livres = P.filter((x) => !f.includes(x)).slice(0, need);
      const nSup = Math.max(0, d.length - livres.length);
      const ord = d.slice().sort((a, b) => ((c.ultSup[a] ?? -1e9) - (c.ultSup[b] ?? -1e9)) || String(a).localeCompare(String(b)));
      const semOntem = ord.filter((pid) => !ehSup(c.ontem[pid]));
      const supL = semOntem.concat(ord.filter((pid) => !semOntem.includes(pid))).slice(0, nSup);
      const usadosSup = f.filter(ehSup);
      let k = 1;
      supL.forEach((pid) => { while (usadosSup.includes(pref + k)) k++; dia.posto[pid] = pref + k; usadosSup.push(pref + k); c.ultSup[pid] = s; });
      const resto = d.filter((pid) => !supL.includes(pid));
      let melhor = null, nota = 1e9;
      (function perm(arr, acc) {
        if (!arr.length) {
          let sc = 0;
          resto.forEach((pid, j) => { const cc = acc[j], i = P.indexOf(c.ontem[pid]); if (cc === c.ontem[pid]) sc += 100; else if (i >= 0 && cc !== P[(i + 1) % P.length]) sc += 1; });
          if (sc < nota) { nota = sc; melhor = acc.slice(); }
          return;
        }
        arr.forEach((x, i) => perm(arr.slice(0, i).concat(arr.slice(i + 1)), acc.concat([x])));
      })(livres, []);
      resto.forEach((pid, j) => { dia.posto[pid] = melhor ? melhor[j] : null; });
      d.forEach((pid) => { if (siglaInfo(dia.cod[pid]).tipo !== 'turno') dia.cod[pid] = dia.posto[pid]; });
    });
    ativos.forEach((p) => { c.ontem[p.id] = dia.posto[p.id] || dia.cod[p.id]; });

}
function diaEscala(s) { if (s < ancora()) return { cod: {}, posto: {}, turno: {} }; return simular(s).dias[s]; }
function codigo(pid, s) { const d = diaEscala(s); return d.cod[pid] || 'x'; }

function escalaMes(a, m) {
  const n = diasNoMes(a, m), dias = [];
  for (let i = 1; i <= n; i++) dias.push(a + '-' + pad(m) + '-' + pad(i));
  simular(dias[n - 1]);
  const ativos = S.equipe.filter((p) => p.ativo !== false);
  const alertas = [];
  const turnos = S.cfg.turnos.map((t) => {
    const pess = ativos.filter((p) => p.turno === t.id).sort((x, y) => x.nome.localeCompare(y.nome));
    const linhas = pess.map((p) => {
      let trab = 0, folgas = 0, fer = 0;
      const cods = dias.map((s) => { const c = codigo(p.id, s); if (trabalhando(c)) { trab++; if (feriado(s) && S.cfg.feriadoModo === 'bh') fer += S.cfg.jornada; } else if (c === 'x') folgas++; return c; });
      return { p, cods, trab, folgas, fer };
    });
    const cob = dias.map((s) => {
      const d = diaEscala(s);
      const tem = Object.keys(d.posto).filter((pid) => d.turno[pid] === t.id && d.posto[pid]).map((pid) => d.posto[pid]);
      const falta = princ().filter((x) => !tem.includes(x));
      if (falta.length) alertas.push({ g: 'er', s, txt: br(s) + ' · ' + t.nome + ': ' + falta.join(', ') + (falta.length === 1 && falta[0] === princ()[princ().length - 1] && tem.length === princ().length - 1 ? ' descoberta' : ' sem ninguém') });
      return falta;
    });
    return { t, linhas, cob };
  });
  // dias seguidos e interjornada (olha 14 dias antes pra pegar sequência que vem do mês anterior)
  ativos.forEach((p) => {
    let seq = 0, ini = null, ant = null, avisado = false;
    for (let s = addD(dias[0], -14); s <= dias[n - 1]; s = addD(s, 1)) {
      const c = codigo(p.id, s), tr = trabalhando(c);
      if (tr) {
        if (!seq) ini = s; seq++;
        const tH = diaEscala(s).turno[p.id];
        if (ant && ant.t !== tH && s >= dias[0]) { const dsc = descansoEntre(ant.t, tH); if (dsc < S.cfg.travas.interjornada) alertas.push({ g: 'er', s, txt: p.nome + ': ' + br(ant.s) + ' no ' + ant.t + ' e ' + br(s) + ' no ' + tH + ' = ' + h(dsc) + ' de descanso (mínimo ' + S.cfg.travas.interjornada + 'h)' }); }
        ant = { t: tH, s };
        if (seq > S.cfg.travas.maxSeguidos && !avisado && s >= dias[0]) { alertas.push({ g: 'er', s, txt: p.nome + ': ' + seq + '+ dias seguidos a partir de ' + br(ini) + ' (máximo ' + S.cfg.travas.maxSeguidos + ')' }); avisado = true; }
      } else { seq = 0; avisado = false; ant = null; }
    }
  });
  alertas.sort((x, y) => x.s.localeCompare(y.s));
  return { dias, turnos, alertas };
}

/* ============ banco de horas ============ */
function excBH(pid) { return (S.cfg.bh.excecoes || {})[pid] || {}; }
function limDia(pid) { const e = excBH(pid); return e.heDia != null ? e.heDia : S.cfg.bh.heDia; }
function diaBH(pid, s) {
  const c = codigo(pid, s), inf = siglaInfo(c) || {}, J = S.cfg.jornada;
  const prev = trabalhando(c) ? J : 0;
  const lanc = S.bh.lanc[pid + '|' + s];
  const real = lanc != null ? lanc : prev;
  let delta = real - prev;
  if (inf.descontaBH) delta -= J;
  if (feriado(s) && S.cfg.feriadoModo === 'bh' && real > 0 && prev > 0) delta += J;
  return { c, prev, real, he: real - prev, delta, lancado: lanc != null };
}
function saldoBH(pid, ate) {
  let s0 = S.cfg.bh.inicio, v = +(S.bh.saldoInicial[pid] || 0);
  if (ate < s0) return v;
  for (let s = s0; s <= ate; s = addD(s, 1)) v += diaBH(pid, s).delta;

}
function segundaDe(s) { const d = dow(s); return addD(s, d === 0 ? -6 : 1 - d); }
function heSemana(pid, seg) { let t = 0; for (let i = 0; i < 7; i++) { const s = addD(seg, i); if (s < S.cfg.bh.inicio) continue; t += diaBH(pid, s).delta; } return Math.round(t * 10) / 10; }
function faixaBH(v) { const b = S.cfg.bh; if (v >= b.critico) return ['Crítico', 'p-er']; if (v >= b.atencao) return ['Atenção', 'p-wa']; if (v < b.minimo) return ['Abaixo do mínimo', 'p-er']; if (v < 0) return ['Negativo', 'p-mu']; return ['Ok', 'p-ok']; }
function sugerirBH(p, qtd) {
  const out = []; const t0 = hojeStr();
  for (let i = 1; i <= 45 && out.length < qtd; i++) {
    const s = addD(t0, i), d = diaEscala(s);
    if (!princ().includes(d.posto[p.id]) && !ehSup(d.posto[p.id])) continue;
    const noTurno = Object.keys(d.posto).filter((pid) => d.turno[pid] === d.turno[p.id] && d.posto[pid]).length;
    if (noTurno - 1 >= princ().length) out.push(s);
  }
  return out;
}

    '<form class="row" data-f="feriado" style="flex-wrap:wrap"><input class="i" style="width:160px" type="date" name="data" required><input class="i" style="flex:1;min-width:160px" name="nome" placeholder="Ex.: Aniversário da cidade" required><label class="row" style="gap:6px;font-size:13px"><input type="checkbox" name="rec" checked> Todo ano</label><button class="btn">Adicionar</button></form></div>';
};
function cfgSet(fn) { fn(S.cfg); salvar('config'); }
C.cfgNome = (el) => cfgSet((c) => { c.equipeNome = el.value; });
C.tNome = (el) => cfgSet((c) => { c.turnos[+el.dataset.i].nome = el.value; });
C.tIni = (el) => { cfgSet((c) => { c.turnos[+el.dataset.i].ini = el.value; }); render(); };
C.tFim = (el) => { cfgSet((c) => { c.turnos[+el.dataset.i].fim = el.value; }); render(); };
A.tAdd = () => { const usados = S.cfg.turnos.map((t) => t.id); const id = 'ABCDEFGH'.split('').find((l) => !usados.includes(l)); cfgSet((c) => c.turnos.push({ id, nome: 'Turno ' + id, ini: '08:00', fim: '16:59' })); render(); };
A.tRem = (el) => { const t = S.cfg.turnos[+el.dataset.i]; if (S.equipe.some((p) => p.turno === t.id)) { toast('Tem gente nesse turno. Mude as pessoas antes.'); return; } if (!confirm('Remover ' + t.nome + '?')) return; cfgSet((c) => c.turnos.splice(+el.dataset.i, 1)); render(); };
A.virada = (el) => { cfgSet((c) => { c.travas.virada = el.dataset.k; }); render(); };
A.trava = (el) => { cfgSet((c) => { const k = el.dataset.k; c.travas[k] = Math.max(k === 'maxSeguidos' ? 1 : 0, Math.min(k === 'maxSeguidos' ? 14 : 24, c.travas[k] + +el.dataset.d)); }); render(); };
function renomeiaCodigo(de, para) {
  if (!de || de === para) return;
  Object.keys(S.ajustes).forEach((k) => { if (S.ajustes[k] === de) S.ajustes[k] = para; });
  S.ausencias.forEach((a) => { if (a.sigla === de) a.sigla = para; });
  salvar('ajustes'); salvar('ausencias');
}
C.pCor = (el) => { cfgSet((c) => { c.postos[+el.dataset.i].cor = el.value; }); render(); };
C.pSig = (el) => { const v = el.value.trim(); if (!v) return; const old = S.cfg.postos[+el.dataset.i].sigla; cfgSet((c) => { c.postos[+el.dataset.i].sigla = v; }); renomeiaCodigo(old, v); render(); };
C.pNome = (el) => cfgSet((c) => { c.postos[+el.dataset.i].nome = el.value; });
A.pMov = (el) => { const i = +el.dataset.i, j = i + +el.dataset.d; if (j < 0 || j >= S.cfg.postos.length) return; cfgSet((c) => { const t = c.postos[i]; c.postos[i] = c.postos[j]; c.postos[j] = t; }); render(); };
A.pRem = (el) => { if (S.cfg.postos.length <= 1) return; if (!confirm('Remover o posto ' + S.cfg.postos[+el.dataset.i].sigla + '?')) return; cfgSet((c) => c.postos.splice(+el.dataset.i, 1)); render(); };
A.pAdd = () => { cfgSet((c) => c.postos.push({ sigla: 'P' + (c.postos.length + 1), nome: 'Novo posto', cor: '#E8E8F0' })); render(); };
C.supCor = (el) => { cfgSet((c) => { c.sup.cor = el.value; }); render(); };
C.supPre = (el) => { const v = el.value.trim(); if (v) { cfgSet((c) => { c.sup.prefixo = v; }); render(); } };
C.supNome = (el) => cfgSet((c) => { c.sup.nome = el.value; });
C.sCor = (el) => { cfgSet((c) => { c.siglas[+el.dataset.i].cor = el.value; }); render(); };
C.sSig = (el) => { const v = el.value.trim(); if (!v) return; const old = S.cfg.siglas[+el.dataset.i].sigla; cfgSet((c) => { c.siglas[+el.dataset.i].sigla = v; }); renomeiaCodigo(old, v); render(); };
C.sNome = (el) => cfgSet((c) => { c.siglas[+el.dataset.i].nome = el.value; });
C.sTipo = (el) => { cfgSet((c) => { const x = c.siglas[+el.dataset.i]; x.tipo = el.value; if (x.tipo === 'turno' && !x.destino) x.destino = c.turnos[0].id; }); render(); };
C.sDest = (el) => cfgSet((c) => { c.siglas[+el.dataset.i].destino = el.value; });
C.sBH = (el) => cfgSet((c) => { c.siglas[+el.dataset.i].descontaBH = el.checked; });
A.sRem = (el) => { const x = S.cfg.siglas[+el.dataset.i]; if (S.ausencias.some((a) => a.sigla === x.sigla)) { toast('Essa sigla está em uso em ausências.'); return; } if (!confirm('Remover a sigla ' + x.sigla + '?')) return; cfgSet((c) => c.siglas.splice(+el.dataset.i, 1)); render(); };
A.sAdd = () => { cfgSet((c) => c.siglas.push({ sigla: 'N' + c.siglas.length, nome: 'Nova sigla', tipo: 'ausencia', cor: '#E8E8F0' })); render(); };
C.ferOff = (el) => { cfgSet((c) => { const d = el.dataset.d; const ex = (c.feriadosExtras || []).findIndex((f) => (f.recorrente ? d.slice(4) === f.data.slice(4) : f.data === d)); if (ex >= 0) c.feriadosExtras.splice(ex, 1); else c.feriadosIgnorados = (c.feriadosIgnorados || []).concat([d]); }); render(); };
C.ferOn = (el) => { cfgSet((c) => { c.feriadosIgnorados = c.feriadosIgnorados.filter((x) => x !== el.dataset.d); }); render(); };
function onFeriado(f) { cfgSet((c) => { c.feriadosExtras = (c.feriadosExtras || []).concat([{ data: f.data.value, nome: f.nome.value.trim(), recorrente: f.rec.checked }]); }); render(); toast('Feriado adicionado'); }

/* ============ EXPORTAR .XLSX ============ */
A.exportar = () => { if (!S.equipe.length) { toast('Cadastre a equipe primeiro'); return; } S.ui.modal = { t: 'exportar', turnos: Object.fromEntries(S.cfg.turnos.map((t) => [t.id, true])) }; render(); };
A.expT = (el) => { const m = S.ui.modal; m.turnos[el.dataset.t] = !m.turnos[el.dataset.t]; render(); };
A.expOp = (el) => { const k = el.dataset.k; S.cfg.exportar[k] = !S.cfg.exportar[k]; salvar('config'); render(); };
M.exportar = () => {
  const [a, m] = mesAtual(), e = S.cfg.exportar, mm = S.ui.modal;
  return '<h2>Exportar escala</h2><span class="sub">Gera a planilha de ' + MESES[m - 1] + ' ' + a + ' (mude o mês na tela da Escala).</span>' +
    '<div class="col" style="gap:6px"><b style="font-size:13px">Turnos</b><div class="chipsel">' + S.cfg.turnos.map((t) => '<button class="' + (mm.turnos[t.id] ? 'on' : '') + '" data-a="expT" data-t="' + t.id + '">' + esc(t.nome) + '</button>').join('') + '</div></div>' +
    '<div class="col" style="gap:4px">' + [['cores', 'Manter as cores das siglas'], ['bh', 'Incluir saldo do banco de horas'], ['abas', 'Uma aba por turno']].map(([k, l]) => '<label class="row" style="gap:8px;font-size:14px;cursor:pointer"><input type="checkbox" data-a="expOp" data-k="' + k + '"' + (e[k] ? ' checked' : '') + '> ' + l + '</label>').join('') + '</div>' +
    '<div class="row" style="justify-content:flex-end"><button class="btn" data-a="fecharModal">Cancelar</button><button class="btn pri" data-a="expBaixar">Baixar .xlsx</button></div>';
};
A.expBaixar = () => {
  if (!window.XLSX) { toast('Carregando o gerador, tente de novo em 2 segundos'); return; }
  const [a, m] = mesAtual(), em = escalaMes(a, m), e = S.cfg.exportar, mm = S.ui.modal, fim = em.dias[em.dias.length - 1];
  const borda = { top: { style: 'thin', color: { rgb: 'DDDDE5' } }, bottom: { style: 'thin', color: { rgb: 'DDDDE5' } }, left: { style: 'thin', color: { rgb: 'DDDDE5' } }, right: { style: 'thin', color: { rgb: 'DDDDE5' } } };
  const cel = (v, cor, bold, align) => { const s = { font: { name: 'Calibri', sz: 10, bold: !!bold, color: { rgb: cor && e.cores ? corTexto(cor).replace('#', '') : '1B1B23' } }, alignment: { horizontal: align || 'center', vertical: 'center' }, border: borda }; if (cor && e.cores) s.fill = { patternType: 'solid', fgColor: { rgb: cor.replace('#', '').toUpperCase() } }; return { v: v, t: typeof v === 'number' ? 'n' : 's', s }; };
  function folha(turnos) {
    const rows = [];
    rows.push([cel('Escala · ' + MESES[m - 1] + ' ' + a + ' · ' + S.cfg.equipeNome, null, true, 'left')]);
    rows.push([cel('Turno', '#EFEAFB', true), cel('Nome', '#EFEAFB', true, 'left')].concat(em.dias.map((s) => cel(+s.slice(8), feriado(s) ? '#FBE3EA' : (dow(s) === 0 || dow(s) === 6) ? '#F3F3F6' : '#EFEAFB', true)), [cel('Trab.', '#EFEAFB', true), cel('Folgas', '#EFEAFB', true)], e.bh ? [cel('Saldo BH', '#EFEAFB', true)] : []));
    rows.push([cel('', '#EFEAFB'), cel('', '#EFEAFB')].concat(em.dias.map((s) => cel(feriado(s) ? 'fer' : SEM[dow(s)], feriado(s) ? '#FBE3EA' : '#EFEAFB')), [cel('', '#EFEAFB'), cel('', '#EFEAFB')], e.bh ? [cel('', '#EFEAFB')] : []));
    turnos.forEach(({ t, linhas, cob }) => {
      linhas.forEach(({ p, cods, trab, folgas }) => {
        rows.push([cel(t.nome, null, true), cel(p.nome, null, false, 'left')].concat(cods.map((c) => cel(c, (siglaInfo(c) || {}).cor, true)), [cel(trab), cel(folgas)], e.bh ? [cel(sh(saldoBH(p.id, fim)))] : []));
      });
      rows.push([cel(t.nome, null, false), cel('Cobertura', null, false, 'left')].concat(cob.map((f) => cel(f.length ? 'Falta ' + f.join('/') : 'ok', f.length ? '#FDECEA' : null)), [cel(''), cel('')], e.bh ? [cel('')] : []));
    });
    rows.push([]);
    rows.push([cel('Legenda', null, true, 'left')]);
    opcoesCodigo().filter((c) => !/3$/.test(c)).forEach((c) => { const i = siglaInfo(c); rows.push([cel(c, i.cor, true), cel(i.nome, null, false, 'left')]); });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 10 }, { wch: 18 }].concat(em.dias.map(() => ({ wch: 5.5 })), [{ wch: 6 }, { wch: 7 }, { wch: 9 }]);
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 10 } }];
    ws['!freeze'] = { xSplit: 2, ySplit: 3 };
    ws['!views'] = [{ state: 'frozen', xSplit: 2, ySplit: 3 }];
    return ws;
  }
  const sel = em.turnos.filter((x) => mm.turnos[x.t.id]);
  if (!sel.length) { toast('Escolha pelo menos um turno'); return; }
  const wb = XLSX.utils.book_new();
  if (e.abas) sel.forEach((x) => XLSX.utils.book_append_sheet(wb, folha([x]), x.t.nome.slice(0, 31)));
  else XLSX.utils.book_append_sheet(wb, folha(sel), 'Escala');
  XLSX.writeFile(wb, 'Escala_' + MESES[m - 1] + '_' + a + '.xlsx');
  S.ui.modal = null; render(); toast('Planilha gerada');
};

/* ============ eventos ============ */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-a]');
  if (!el) { if (S.ui.pop && !ev.target.closest('.pop')) { S.ui.pop = null; S.ui.manterScroll = true; render(); } return; }
  if (el.dataset.a === 'fecharModal' && el.classList.contains('modal-fundo') && ev.target.closest('[data-stop]')) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') { /* deixa o checkbox marcar e reage */ }
  const fn = A[el.dataset.a]; if (fn) { if (el.tagName === 'A') ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', (ev) => { const el = ev.target.closest('[data-c]'); if (el && C[el.dataset.c]) C[el.dataset.c](el, ev); });
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-f]'); if (!f) return; ev.preventDefault();
  ({ login: onLogin, pessoa: onPessoa, importar: onImportar, ausencia: onAusencia, tarefa: onTarefa, reuniao: onReuniao, feriado: onFeriado })[f.dataset.f](f);
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && (S.ui.modal || S.ui.pop)) { S.ui.modal = null; S.ui.pop = null; render(); } });

/* ============ início ============ */
async function entrar(user) {
  if (S.user && S.user.id === user.id) return;
  S.user = user;
  $('#raiz').innerHTML = '<div class="login card"><span class="sub">Carregando sua equipe…</span></div>';
  try { await carregar(); } catch (e) { $('#raiz').innerHTML = '<div class="login card col"><h2>Não consegui carregar</h2><span class="sub">' + esc(e.message || e) + '</span><button class="btn" onclick="location.reload()">Tentar de novo</button></div>'; return; }
  _escCache = {};
  render();
}
sb.auth.onAuthStateChange((evt, sess) => { if (sess && sess.user) entrar(sess.user); else if (evt === 'SIGNED_OUT') { S.user = null; render(); } });
sb.auth.getSession().then(({ data }) => { if (data.session) entrar(data.session.user); else render(); });
</script>
